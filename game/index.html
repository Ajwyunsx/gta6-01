<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palm City</title>
    <meta name="description" content="Palm City — an original top-down open-world crime game on a sun-soaked coast." />
    <style>
      :root {
        color-scheme: dark;
        --paper: #f7efe0;
      }
      * { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14121c;
        overflow: hidden;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--paper);
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #c9b998;
        cursor: crosshair;
        image-rendering: auto;
      }
      /* A thin warm frame so the canvas never bleeds into a black browser chrome. */
      #frame {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 120px rgba(10, 8, 20, 0.55);
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #14121c;
        color: #f7efe0;
        font-size: 15px;
        letter-spacing: 0.16em;
        transition: opacity 0.3s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="1280" height="720" aria-label="Palm City game canvas"></canvas>
    </div>
    <div id="frame"></div>
    <div id="loading">LOADING PALM CITY</div>

    <script>
      // Hide the loader as soon as the first frame has drawn.
      window.addEventListener('load', function () {
        var el = document.getElementById('loading');
        if (el) setTimeout(function () { el.classList.add('hidden'); }, 120);
      });
    </script>

    <script src="src/config.js"></script>
    <script src="src/city.js"></script>
    <script src="src/entities.js"></script>
    <script src="src/vehicles.js"></script>
    <script src="src/traffic.js"></script>
    <script src="src/police.js"></script>
    <script src="src/combat.js"></script>
    <script src="src/missions.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/effects.js"></script>
    <script src="src/input.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/hud.js"></script>
    <script src="src/render.js"></script>
    <script src="src/world.js"></script>
    <script src="src/shots.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
