<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c14; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    cursor: crosshair;
    background: #0d0c14;
    image-rendering: auto;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0d0c14; color: #ff5f9e; font: 700 13px ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.3em; pointer-events: none; transition: opacity 0.5s ease;
  }
  #boot.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palm City: an open-world crime game. Drive and walk through a neon city, take jobs from Dessa Marrow, and keep the cops off your back."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="boot">PALM CITY</div>
<script type="module" src="./src/main.js"></script>
<script>
  // The boot card is only a flash of paint before the first frame; the game proper
  // draws its own title screen once the module above has run.
  addEventListener('load', () => {
    const boot = document.getElementById('boot');
    if (!boot) return;
    setTimeout(() => boot.classList.add('gone'), 260);
    setTimeout(() => boot.remove(), 900);
  });
  // A failed module must not fail silently: the status line keeps the error readable.
  window.addEventListener('error', (event) => {
    const status = document.getElementById('status');
    if (status) status.textContent = 'error: ' + (event.message || '') + ' @ ' + (event.filename || '') + ':' + (event.lineno || 0);
  });
</script>
</body>
</html>
