<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe</title>
<script>window.__errs=[];window.addEventListener('error',function(e){window.__errs.push((e.message||'')+' @ '+(e.filename||'')+':'+(e.lineno||0));});</script>
</head><body>
<script src="src/config.js"></script>
<script src="src/city.js"></script>
<script src="src/entities.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/traffic.js"></script>
<script src="src/police.js"></script>
<script src="src/combat.js"></script>
<script src="src/missions.js"></script>
<script src="src/streets.js"></script>
<script src="src/hud.js"></script>
<script src="src/ui.js"></script>
<script src="src/audio.js"></script>
<script src="src/effects.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/world.js"></script>
<script src="src/shots.js"></script>
<script>
try{
 var c=document.createElement('canvas');c.width=1280;c.height=720;document.body.appendChild(c);
 var r=new PC.Renderer(c);var w=new PC.World(c);w.renderer=r;
 w.startNewGame();
 var inp=new PC.Input(c);
 for(var i=0;i<60;i++)w.step(PC.CFG.STEP,inp);
 r.draw(w);
 window.__ok='ok time='+w.time.toFixed(2);
}catch(e){window.__errs.push('THROW '+e.message+' | '+e.stack);}
document.title=(window.__errs[0]||window.__ok||'nothing');
</script></body></html>
