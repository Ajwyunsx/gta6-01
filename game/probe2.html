<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe2</title></head><body>
<canvas id="game" width="1280" height="720"></canvas>
<script src="src/config.js"></script><script src="src/city.js"></script><script src="src/entities.js"></script>
<script src="src/vehicles.js"></script><script src="src/traffic.js"></script><script src="src/police.js"></script>
<script src="src/combat.js"></script><script src="src/missions.js"></script><script src="src/streets.js"></script>
<script src="src/hud.js"></script><script src="src/ui.js"></script><script src="src/audio.js"></script>
<script src="src/effects.js"></script><script src="src/input.js"></script><script src="src/render.js"></script>
<script src="src/world.js"></script><script src="src/shots.js"></script>
<script>
var out='';
try{
  var c=document.getElementById('game'); var r=new PC.Renderer(c);
  var w=new PC.World(c); w.renderer=r; var inp=new PC.Input(c);
  PCShots.setup(w,inp,1);
  out+='before car='+w.player.inCar.x.toFixed(0)+','+w.player.inCar.y.toFixed(0)+' ang='+w.player.inCar.angle.toFixed(2)+'; ';
  for(var i=0;i<90;i++)w.step(PC.CFG.STEP,inp);
  var car=w.player.inCar;
  out+='after car='+car.x.toFixed(0)+','+car.y.toFixed(0)+' spd='+car.speed.toFixed(0)+' h='+car.health.toFixed(0)+'; cam='+w.camera.x.toFixed(0)+','+w.camera.y.toFixed(0)+' z='+w.camera.zoom.toFixed(2);
}catch(e){out='THROW '+e.message;}
document.title=out;
</script></body></html>
