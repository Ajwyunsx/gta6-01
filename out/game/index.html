<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palm City — an open-world crime story</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Palm City: a top-down open-world crime game. Seven jobs, a beach city, police who answer the heat — played with keyboard and mouse in a browser.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0910;
    color: #f7f0e1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    background: #0e1218;
    touch-action: none;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: radial-gradient(120% 90% at 50% 45%, #2a1a2e 0%, #0b0910 70%);
    z-index: 20;
    transition: opacity 320ms ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot h1 {
    margin: 0;
    font-size: clamp(34px, 7vw, 76px);
    letter-spacing: 0.14em;
    font-weight: 800;
    color: #f7f0e1;
  }
  #boot h1 span { color: #e2684f; }
  #boot p { margin: 0; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(247,240,225,0.45); }
  #boot button {
    margin-top: 18px;
    padding: 12px 30px;
    border-radius: 999px;
    border: 1px solid rgba(247,240,225,0.28);
    background: rgba(255,95,162,0.14);
    color: #f7f0e1;
    font: 700 14px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #boot button:hover { background: rgba(255,95,162,0.28); }
  #boot small { color: rgba(247,240,225,0.38); font-size: 11px; letter-spacing: 0.06em; }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0910; z-index: 30; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Palm City game view"></canvas>

<div id="boot">
  <h1>PALM <span>CITY</span></h1>
  <p>An open-world crime story</p>
  <button id="boot-start" type="button">Enter the city</button>
  <small>WASD to walk · E to steal a car · F to fire · ESC to pause</small>
</div>

<noscript>Palm City needs JavaScript enabled to run.</noscript>

<script src="src/config.js"></script>
<script src="src/city.js"></script>
<script src="src/entities.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/traffic.js"></script>
<script src="src/police.js"></script>
<script src="src/combat.js"></script>
<script src="src/missions.js"></script>
<script src="src/streets.js"></script>
<script src="src/hud.js"></script>
<script src="src/ui.js"></script>
<script src="src/audio.js"></script>
<script src="src/effects.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/world.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
<script>
  (function () {
    var boot = document.getElementById('boot');
    var start = document.getElementById('boot-start');
    function go() {
      if (boot) boot.classList.add('gone');
      setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 420);
      var world = window.__palmCity;
      if (world && world.audio) {
        try { world.audio.start(); world.audio.resume(); } catch (e) { void e; }
      }
      // entering from the boot card starts a fresh run rather than sitting on the title
      if (world && world.ui && world.ui.screen === 'title' && !window.__shotMode) {
        world.startNewGame();
      }
    }
    if (start) start.addEventListener('click', go);
    window.addEventListener('keydown', function (e) {
      if (boot && boot.classList.contains('gone')) return;
      if (e.code === 'Enter' || e.code === 'Space') go();
    });
    var shot = /[?&]shot=/.test(location.search);
    window.__shotMode = shot;
    if (shot) {
      if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
      // the shot pass drives its own scene; keep the simulation on the title camera out of the way
      setTimeout(function () {
        var world = window.__palmCity;
        if (world) world.ui.screen = 'playing';
      }, 0);
    }
  })();
</script>
</body>
</html>
